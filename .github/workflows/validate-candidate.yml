name: Validate candidate

on:
  push:
    paths:
      - 'candidate/**'
      - 'tests/**'
      - '.github/workflows/validate-candidate.yml'
  pull_request:
    paths:
      - 'candidate/**'
      - 'stable/**'
      - 'tests/**'
      - '.github/workflows/validate-candidate.yml'

permissions:
  contents: read

jobs:
  protect-stable:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block automatic stable changes
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^stable/'; then
            echo 'stable/ changed in this PR. Stable promotion requires explicit user approval.'
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate exists
        run: test -s candidate/ReisWijzer.user.js
      - name: JavaScript syntax check
        run: node --check candidate/ReisWijzer.user.js
      - name: Verify userscript metadata
        shell: bash
        run: |
          grep -q '^// @name .*Candidate' candidate/ReisWijzer.user.js
          grep -q '^// @version ' candidate/ReisWijzer.user.js
          grep -q '^// @updateURL https://raw.githubusercontent.com/vanderzeemichael45-bit/reiswijzer/main/candidate/ReisWijzer.user.js' candidate/ReisWijzer.user.js
          grep -q '^// @downloadURL https://raw.githubusercontent.com/vanderzeemichael45-bit/reiswijzer/main/candidate/ReisWijzer.user.js' candidate/ReisWijzer.user.js
      - name: Guard fare safety invariant
        run: grep -q 'unsafeSegmentSumming' candidate/ReisWijzer.user.js
      - name: Run repository regression tests when present
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.mjs tests/*.js)
          if [ ${#tests[@]} -eq 0 ]; then
            echo 'No repository tests yet; metadata and syntax checks completed.'
            exit 0
          fi
          for testfile in "${tests[@]}"; do
            echo "Running $testfile"
            node "$testfile"
          done
